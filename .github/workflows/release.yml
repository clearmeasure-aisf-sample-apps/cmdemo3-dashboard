# Release of the health dashboard as a container image, for a system that serves it from its cluster (runtime
# aks-argocd). In the template this file is no workflow (.github/release-image.yml): add-demo-deployable.ps1 puts it
# in place of the zip release, as .github/workflows/release.yml, for a system of that runtime and leaves it out of
# every other.
# After a green Build of master, it turns that build's published site into a release candidate:
#   - the image <registry>/<slug>/<deployable>:<version> (Dockerfile: the site behind nginx), pushed to the system's
#     registry and locked, so a released image never changes
#   - a release <version> of the Octopus project <slug>-<deployable>; its lifecycle deploys it to the first environment
# The image is the same in every environment: the deployment commits what an environment's page shows
# (topology.json, runtime/) to the system repository, and the cluster mounts it; the image carries the sample.
# The version is the Build run's MAJOR.MINOR.run_number, the same number build.yml stamps into the dashboard.
# Credentials: GitHub OIDC only (environment "release"): Azure as the registry's push identity, Octopus as the
# system's service account.
name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The Octopus actions (push-package, create-release) look the space up by name, not by ID.
  OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE_NAME }}

jobs:
  # Only a Build run that published the site has something to release.
  packages:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    outputs:
      found: ${{ steps.find.outputs.found }}
    steps:
      - name: Find the build's site
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq '[.artifacts[] | select(.name == "dashboard-site")] | length')
          if [ "$count" -gt 0 ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: packages
    if: needs.packages.outputs.found == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content -LiteralPath .github/workflows/build.yml -Raw
          $major = [regex]::Match($workflow, '(?m)^\s*MAJOR_VERSION:\s*(\d+)').Groups[1].Value
          $minor = [regex]::Match($workflow, '(?m)^\s*MINOR_VERSION:\s*(\d+)').Groups[1].Value
          if (-not $major -or -not $minor) { throw 'MAJOR_VERSION and MINOR_VERSION not found in build.yml' }
          "version=$major.$minor.${{ github.event.workflow_run.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Download the build's site
        uses: actions/download-artifact@v8
        with:
          name: dashboard-site
          path: ./site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check the site
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath ./site/index.html)) { throw 'index.html not found at the root of the build artifact' }

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.SYSTEM_SLUG }}/${{ vars.DEPLOYABLE_NAME }}:${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build --file Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"
          # A released image never changes: lock its tag (role "ACR tag lock" of the seed).
          az acr repository update --name "${{ vars.ACR_NAME }}" --image "${{ vars.SYSTEM_SLUG }}/${{ vars.DEPLOYABLE_NAME }}:${{ steps.version.outputs.version }}" \
            --write-enabled false --delete-enabled false --output none
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Octopus
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ vars.OCTOPUS_URL }}
          service_account_id: ${{ vars.OCTOPUS_SERVICE_ACCOUNT_ID }}

      - name: Create the release
        uses: OctopusDeploy/create-release-action@v4
        with:
          project: ${{ vars.SYSTEM_SLUG }}-${{ vars.DEPLOYABLE_NAME }}
          release_number: ${{ steps.version.outputs.version }}
          package_version: ${{ steps.version.outputs.version }}
          ignore_existing: true
          release_notes: "Build ${{ github.event.workflow_run.html_url }} of ${{ github.event.workflow_run.head_sha }}"
