# The dashboard's web server in a cluster (the Dockerfile copies this to /etc/nginx/conf.d/default.conf). The site is
# static and served from the root of its host. topology.json and runtime/ are not the image's (it carries the sample):
# the cluster mounts the environment's own at /content, as flat files (topology.json, runtime-<name>), and they are
# never cached, because a deployment replaces them while the page is open.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The Blazor runtime: nginx's own type list serves .wasm as application/wasm; the build's precompressed .gz files
    # are used when present.
    gzip_static on;

    location = /topology.json {
        alias /content/topology.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/runtime/([A-Za-z0-9._-]+)$ {
        alias /content/runtime-$1;
        add_header Cache-Control "no-store" always;
    }

    # index.html is small and names the files of the release: always the current one.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
